name: Build UCI connector
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    name: Publish ${{ matrix.runtime }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    env:
      LAPLACE_UCI_BUILD_ROOT: ${{ runner.temp }}/uci-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - name: Validate Windows setup syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup-iis.ps1'),[ref]$tokens,[ref]$errors)
          if($errors){$errors | Write-Error; exit 1}
      - name: Validate Linux setup syntax
        if: runner.os == 'Linux'
        run: python3 -m py_compile setup.py
      - name: Publish
        run: dotnet publish src/Laplace.Uci/Laplace.Uci.csproj -c Release -r ${{ matrix.runtime }} --self-contained false -o artifacts/connector
      - name: Package installation inputs
        shell: pwsh
        run: |
          Copy-Item setup.py,setup-iis.ps1,README.md,configuration.example.json artifacts/
          Set-Content artifacts/revision.txt '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-uci-${{ matrix.runtime }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
